services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      THICC_RUNTIME: node
      APP_ORIGIN: ${APP_ORIGIN:-https://thicc.money}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters}
      AGENT_CRON_TOKEN: ${AGENT_CRON_TOKEN:?Set a different random AGENT_CRON_TOKEN}
      DATABASE_PATH: /data/thicc.sqlite
      PORT: "3187"
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      EXECUTION_PAUSED: ${EXECUTION_PAUSED:-false}
      QUICKNODE_RPC_URL: ${QUICKNODE_RPC_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      AGENT_WALLET_ENCRYPTION_KEY: ${AGENT_WALLET_ENCRYPTION_KEY:-}
      SOLCARD_DEPOSIT_ADDRESS: ${SOLCARD_DEPOSIT_ADDRESS:-}
      THICC_TOKEN_MINT: ${THICC_TOKEN_MINT:-}
      AGENT_DAILY_FUNDING_CAP_USD: unlimited
    volumes:
      - thicc-data:/data
    expose:
      - "3187"
    networks:
      - dokploy-network
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3187/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker:
    build:
      context: .
      target: web
    command: ["node", "deploy/worker.mjs"]
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    depends_on:
      web:
        condition: service_healthy
    environment:
      AGENT_CRON_TOKEN: ${AGENT_CRON_TOKEN:?Set AGENT_CRON_TOKEN}
      WORKER_API_ORIGIN: http://web:3187
    networks:
      - app

volumes:
  thicc-data:

networks:
  dokploy-network:
    external: true
  app:
